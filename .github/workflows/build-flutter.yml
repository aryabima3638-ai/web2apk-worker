name: Build Flutter APK
on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Build job ID
        required: true
        type: string
      userId:
        description: Telegram user ID
        required: false
        type: string
      payload:
        description: Build payload JSON
        required: false
        type: string
        default: '{}'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare project ZIP
        env:
          PAYLOAD: ${{ inputs.payload }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          p=json.loads(os.environ.get('PAYLOAD') or '{}')
          url=p.get('zipAssetUrl')
          if not url: raise SystemExit('Payload tidak berisi zipAssetUrl. Pastikan build menggunakan upload ZIP.')
          import urllib.request
          req=urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=300) as r, open('/tmp/project.zip','wb') as f: f.write(r.read())
          PY
          mkdir -p source
          unzip -q /tmp/project.zip -d source
          PUBSPEC=$(find source -name pubspec.yaml -print -quit)
          if [ -z "$PUBSPEC" ]; then echo 'pubspec.yaml tidak ditemukan dalam ZIP'; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 1
